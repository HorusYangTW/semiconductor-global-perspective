<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><meta name="description" content="115-1 半導體產業全球視野"><title>書單目錄｜Reading List</title><style>

</style></head><body id="top"><header class="topbar"><div class="topbar-inner"><div class="brand"><strong>書單目錄｜Reading List</strong><span>原始教材第 1–3 頁</span></div><div class="actions"><a class="btn" href="./index.html">← 主頁</a><button type="button" id="zoom-out" aria-label="縮小">−</button><button type="button" id="fit" aria-label="符合視窗">Fit</button><button type="button" id="zoom-in" aria-label="放大">＋</button></div></div><div class="progress"><div id="progress"></div></div></header><section class="reader-intro"><h1>書單目錄｜Reading List</h1><p>本頁只保留原教材的書單與延伸閱讀內容，已從整合版中獨立拆出。</p></section><main class="pages"><article class="page" id="page-01"><img src="assets/booklist/page-01.webp" alt="書單目錄｜Reading List 原稿第 1 頁" loading="eager" decoding="async"><div class="page-number">原稿第 1 頁 · 1 / 3</div></article><article class="page" id="page-02"><img src="assets/booklist/page-02.webp" alt="書單目錄｜Reading List 原稿第 2 頁" loading="eager" decoding="async"><div class="page-number">原稿第 2 頁 · 2 / 3</div></article><article class="page" id="page-03"><img src="assets/booklist/page-03.webp" alt="書單目錄｜Reading List 原稿第 3 頁" loading="lazy" decoding="async"><div class="page-number">原稿第 3 頁 · 3 / 3</div></article></main><div class="floating"><a href="#top" title="回到頁首">↑</a></div><script>
const root=document.documentElement;let width=900;
const setWidth=v=>{width=Math.max(520,Math.min(1500,v));root.style.setProperty('--page-width',width+'px')};
document.getElementById('zoom-in').onclick=()=>setWidth(width+100);
document.getElementById('zoom-out').onclick=()=>setWidth(width-100);
document.getElementById('fit').onclick=()=>{width=Math.max(320,Math.min(900,window.innerWidth-28));root.style.setProperty('--page-width',width+'px')};
const prog=document.getElementById('progress');addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;prog.style.width=(max>0?scrollY/max*100:0)+'%'});
if(innerWidth<930)document.getElementById('fit').click();
</script></body></html>
